name = "sonexa-gateway"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Serves Sonexa on the custom domain. Requests are proxied to Render; when the
# Render service is suspended, unreachable or too slow, the maintenance page is
# shown instead. Requires devgyana.in to be an active zone in Cloudflare.
routes = [
  { pattern = "staging-sonexa.devgyana.in", custom_domain = true },
]

[vars]
# Render service URL (no trailing slash). Update if the service is renamed.
ORIGIN_URL = "https://sonexa.onrender.com"
# How long to wait for Render before giving up. Free instances take ~30-60s to
# wake from sleep, so keep this generous.
ORIGIN_TIMEOUT_MS = "60000"
# Set to "true" to show the maintenance page without contacting Render.
FORCE_MAINTENANCE = "false"
