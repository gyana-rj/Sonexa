<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sonexa — Under maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: hsl(240 10% 4%);
        --card: hsl(240 6% 7%);
        --border: hsl(240 5% 14%);
        --foreground: hsl(0 0% 98%);
        --muted: hsl(240 4% 63%);
        --primary: hsl(262 83% 58%);
        --accent: hsl(217 91% 60%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60rem 30rem at 50% -10%, hsl(262 83% 58% / 0.18), transparent 70%),
          radial-gradient(40rem 24rem at 90% 110%, hsl(217 91% 60% / 0.12), transparent 70%),
          var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 480px;
        padding: 40px 32px;
        text-align: center;
        background: hsl(240 6% 7% / 0.8);
        border: 1px solid var(--border);
        border-radius: 24px;
        backdrop-filter: blur(12px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: Fraunces, Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
      }

      .equalizer {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 6px;
        height: 56px;
        margin: 36px 0 28px;
      }

      .equalizer span {
        width: 8px;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(to top, var(--primary), var(--accent));
        transform-origin: bottom;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .equalizer span:nth-child(2) { animation-delay: -0.9s; }
      .equalizer span:nth-child(3) { animation-delay: -0.6s; }
      .equalizer span:nth-child(4) { animation-delay: -0.3s; }
      .equalizer span:nth-child(5) { animation-delay: -0.75s; }

      @keyframes bounce {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }

      h1 {
        margin: 0 0 12px;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(26px, 6vw, 32px);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
      }

      .status {
        margin-top: 28px;
        font-size: 14px;
      }

      button {
        margin-top: 12px;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--foreground);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.1);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .equalizer span {
          animation: none;
          transform: scaleY(0.6);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Sonexa</div>

      <div class="equalizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <h1>We're taking a short break</h1>
      <p>Sonexa is under maintenance right now. The music will be back soon, and your playlists and rooms are safe.</p>
      <p>Please check back in a little while.</p>

      <p class="status" role="status" aria-live="polite">
        Checking again in <span id="countdown">60</span>s
      </p>
      <button type="button" id="retry">Try again now</button>
    </main>

    <script>
      (function () {
        var seconds = 60;
        var label = document.getElementById("countdown");
        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });
        setInterval(function () {
          seconds -= 1;
          if (seconds <= 0) {
            location.reload();
            return;
          }
          label.textContent = seconds;
        }, 1000);
      })();
    </script>
  </body>
</html>
